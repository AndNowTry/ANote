services:
  backend:
    build: ./backend
    env_file:
      - .env
    volumes:
      - ./backend/app:/app
      - ./backend/data:/data
    ports:
      - "8000:8000"
    networks:
      - ANote-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_API_TIMEOUT: ${VITE_API_TIMEOUT}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - ANote-network
    command: npm run dev -- --host 0.0.0.0

networks:
  ANote-network:
    driver: bridge