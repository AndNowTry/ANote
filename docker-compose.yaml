services:
  backend:
    build: ./backend
    volumes:
      - ./backend/app:/app
      - ./backend/data:/data
    ports:
      - "8000:8000"
    networks:
      - ANote-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - ANote-network
    command: npm run dev -- --host 0.0.0.0

networks:
  ANote-network:
    driver: bridge